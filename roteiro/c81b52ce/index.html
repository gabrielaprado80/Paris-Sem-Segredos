<style>
:root{
  --navy:#1E2A47; --navy-deep:#0E1730; --navy-2:#2A3860;
  --cream:#F5EEE0; --cream-soft:#FBF7EF;
  --gold:#D7A94B; --gold-2:#E9C46A; --gold-deep:#9C7420;
  --wine:#7C3B3B; --brown:#4B3232;
  --ink:#22283A; --ink-soft:#5A6076;
  --line:rgba(30,42,71,.12);
  --sh:0 2px 10px rgba(30,42,71,.05);
  --sh-lg:0 14px 40px rgba(30,42,71,.11);
  --display:'Cormorant Garamond',Georgia,serif;
  --body:'Mulish',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --wrap:780px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:82px}
body{
  font-family:var(--body); font-size:16px; line-height:1.62;
  color:var(--ink); padding-bottom:80px;
  background:
    radial-gradient(900px 520px at 88% 2%,rgba(215,169,75,.11),transparent 60%),
    radial-gradient(800px 500px at 4% 34%,rgba(30,42,71,.05),transparent 62%),
    var(--cream);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
svg.i{flex:none;vertical-align:-.16em}

/* ---------- utilidades ---------- */
.grad{
  background:linear-gradient(96deg,var(--gold-deep) 0%,var(--gold) 42%,var(--gold-2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.grad-luz{
  background:linear-gradient(96deg,#FFF7E6 0%,var(--gold-2) 62%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.vidro{
  background:rgba(255,255,255,.58);
  -webkit-backdrop-filter:blur(14px) saturate(1.25);
  backdrop-filter:blur(14px) saturate(1.25);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:var(--sh);
}
.vidro-esc{
  background:rgba(255,255,255,.07);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  border:1px solid rgba(233,196,106,.26);
}

  padding:70px 20px 86px;

}

.capa-brilho{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(14,23,48,.55) 0%,rgba(14,23,48,.25) 45%,rgba(14,23,48,.6) 100%),
    radial-gradient(360px 220px at 12% 18%,rgba(233,196,106,.20),transparent 70%),
    radial-gradient(420px 260px at 88% 78%,rgba(233,196,106,.14),transparent 70%);
}
.capa-logo{width:96px;height:96px;display:block;margin:0 auto 18px;border-radius:50%}
@media print{.capa-logo{width:76px;height:76px}}
.capa::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:96px;
  background:linear-gradient(to bottom,transparent,var(--cream));
}
.capa-in{position:relative;z-index:2;max-width:600px;margin:0 auto}
.marca{
  font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold-2);font-weight:700;margin-bottom:28px;
}
.saud{
  font-family:var(--display);font-style:italic;font-size:clamp(21px,5.2vw,27px);
  color:rgba(255,255,255,.9);margin-bottom:2px;
}
.capa h1{
  font-family:var(--display);font-size:clamp(62px,18vw,116px);
  font-weight:600;line-height:.92;letter-spacing:-.03em;margin-bottom:14px;
}
.capa-sub{font-size:15.5px;color:rgba(255,255,255,.78);margin-bottom:30px;line-height:1.5}
.capa-datas{
  display:inline-flex;align-items:center;gap:20px;
  padding:14px 26px;border-radius:14px;margin-bottom:22px;
}
.capa-datas b{font-family:var(--display);font-size:25px;font-weight:600;display:block;line-height:1.15;color:#fff}
.capa-datas span{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.capa-datas .sep{color:var(--gold-2)}
.cron{
  display:inline-flex;align-items:center;gap:10px;
  padding:11px 22px;border-radius:999px;
  font-size:13px;color:rgba(255,255,255,.85);letter-spacing:.04em;
}
.cron b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.capa-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.capa-chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;
  font-size:12px;font-weight:600;color:rgba(255,255,255,.88);
  background:rgba(255,255,255,.09);border:1px solid rgba(233,196,106,.24);
}
.capa-datas-tbd{padding:12px 24px}
.capa-datas-tbd b{font-size:19px}
.capa-cta-roteiro{margin-top:30px;display:inline-flex;align-items:center;gap:9px;
  padding:15px 30px;border-radius:99px;font-family:var(--display);font-size:16px;font-weight:700;
  color:#0E1730;background:linear-gradient(135deg,#E9C46A,#D7A94B);
  box-shadow:0 8px 24px rgba(233,196,106,.35);text-decoration:none;letter-spacing:.01em}
.rolar{margin-top:34px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.42)}
.rolar svg{display:block;margin:9px auto 0;animation:bo 2.6s infinite}
@keyframes bo{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ---------- navegação ---------- */
.nav{position:sticky;top:0;z-index:70;
  background:rgba(245,238,224,.9);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav-sc{display:flex;gap:7px;overflow-x:auto;padding:11px 20px;max-width:var(--wrap);margin:0 auto;scrollbar-width:none}
.nav-sc::-webkit-scrollbar{display:none}
.nav a{
  flex:0 0 auto;text-decoration:none;font-size:12.5px;font-weight:700;
  color:var(--navy);background:rgba(255,255,255,.7);border:1px solid var(--line);
  padding:7px 14px;border-radius:999px;white-space:nowrap;transition:.18s;
}
.nav a:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- carta ---------- */
.carta{padding:30px 0 6px}
.carta-box{border-radius:18px;padding:28px 26px;position:relative;overflow:hidden}
.carta-box::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--gold-2),var(--gold),transparent);
}
.carta p{font-family:var(--display);font-size:20.5px;line-height:1.55;color:var(--brown);margin-bottom:13px}
.carta p:last-of-type{margin-bottom:0}
.carta .assina{font-family:var(--display);font-style:italic;font-size:19px;margin-top:18px}

/* ---------- seções ---------- */
.sec{padding:46px 0 6px}
.sec-cab{margin-bottom:22px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-deep);font-weight:800;margin-bottom:9px;
}
.sec-cab h2{font-family:var(--display);font-size:clamp(31px,7.4vw,44px);font-weight:700;line-height:1.04;letter-spacing:-.02em}
.sec-cab p{color:var(--ink-soft);font-size:15px;margin-top:9px;max-width:56ch}

/* ---------- cartões ---------- */
.card{border-radius:16px;padding:22px;margin-bottom:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.card-tit{font-family:var(--display);font-size:24px;font-weight:700;color:var(--navy);line-height:1.18;margin-bottom:5px;display:flex;align-items:center;gap:9px}
.eti{
  display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;font-weight:800;padding:5px 10px;border-radius:6px;
  background:linear-gradient(96deg,rgba(215,169,75,.2),rgba(233,196,106,.28));
  color:var(--gold-deep);
}
.eti.nav-e{background:rgba(30,42,71,.08);color:var(--navy)}
.eti.wine{background:rgba(124,59,59,.1);color:var(--wine)}

/* lista de pares com ícone */
.linhas{display:flex;flex-direction:column;gap:2px}
.linha{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.linha:last-child{border-bottom:none;padding-bottom:0}
.linha .ico{width:32px;height:32px;font-size:13px;font-weight:800;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,rgba(215,169,75,.16),rgba(233,196,106,.1));color:var(--gold-deep)}
.linha .txt{flex:1;min-width:0}
.linha .rot{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--ink-soft);margin-bottom:1px}
.linha .val{display:block;font-size:15px;line-height:1.5}

/* ---------- abas ---------- */
.abas{display:flex;gap:7px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{
  flex:0 0 auto;cursor:pointer;font-family:var(--body);font-size:13px;font-weight:700;
  padding:9px 16px;border-radius:999px;white-space:nowrap;transition:.2s;
  border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--navy);
}
.aba[aria-selected="true"]{
  background:linear-gradient(96deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(30,42,71,.22);
}
.aba small{display:block;font-size:10px;font-weight:600;opacity:.7;letter-spacing:.04em}
.painel[hidden]{display:none}

/* ---------- voos ---------- */
.voo-card{border-radius:16px;padding:20px 22px;margin-bottom:12px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#fff,rgba(245,238,224,.6));border:1px solid var(--line);box-shadow:var(--sh)}
.voo-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.voo-cia{font-size:14.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.voo{display:flex;align-items:center;gap:12px}
.voo-lado{text-align:center;min-width:78px}
.voo-hora{font-family:var(--display);font-size:31px;font-weight:700;color:var(--navy);line-height:1}
.voo-cod{font-size:12.5px;font-weight:800;letter-spacing:.06em;margin-top:3px}
.voo-cid{font-size:11.5px;color:var(--ink-soft)}
.voo-meio{flex:1;text-align:center;position:relative;padding:0 4px}
.voo-meio::before{content:"";position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed rgba(215,169,75,.7)}
.voo-dur{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--cream-soft);
  padding:3px 10px;border-radius:999px;font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line)}

/* ---------- opções de transporte (aeroporto) ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.opt{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);
  display:flex;flex-direction:column;transition:.2s}
.opt:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.opt.rec{border-color:var(--gold);box-shadow:0 0 0 2px rgba(215,169,75,.18),var(--sh)}
.opt-cab{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(245,238,224,.7);border-bottom:1px solid var(--line)}
.opt.rec .opt-cab{background:linear-gradient(96deg,rgba(215,169,75,.2),rgba(233,196,106,.13))}
.opt-nome{font-size:13.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:7px}
.opt-sel{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);display:flex;align-items:center;gap:4px}
.opt-corpo{padding:16px;flex:1}
.opt-l{padding:8px 0;font-size:13.5px;color:var(--ink-soft);border-top:1px solid var(--line)}
.opt-l:first-child{border-top:none;padding-top:0}
.opt-l b{display:block;color:var(--ink-soft);font-weight:800;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:2px}
.opt-l span{color:var(--ink);display:block;line-height:1.5}
.opt-pe{padding:13px 16px;background:rgba(245,238,224,.55);border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:7px}
.opt-preco{font-family:var(--display);font-size:27px;font-weight:700;color:var(--navy);line-height:1.05;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.opt-preco small{font-family:var(--body);font-size:10.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.05em}
.opt-tempo{font-size:11.5px;font-weight:700;color:var(--gold-deep);display:flex;align-items:center;gap:5px}

/* ---------- dia ---------- */
.dia-cab{border-radius:18px;padding:22px 24px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 160% at 8% 0%,var(--navy-2),var(--navy) 55%,var(--navy-deep))}
.dia-cab::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,196,106,.2),transparent 68%)}
.dia-num{font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:var(--gold-2);margin-bottom:7px}
.dia-cab h3{font-family:var(--display);font-size:clamp(26px,6.4vw,35px);font-weight:700;line-height:1.08;position:relative}
.dia-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;position:relative}
.dia-meta span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(233,196,106,.24);color:rgba(255,255,255,.9)}

/* trilho */
.trilho{position:relative;padding-left:26px;margin-left:6px}
.trilho::before{content:"";position:absolute;left:0;top:10px;bottom:16px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold),rgba(215,169,75,.5) 70%,transparent)}
.parada{position:relative;margin-bottom:14px}
.parada::before{content:"";position:absolute;left:-31px;top:16px;width:11px;height:11px;border-radius:50%;
  background:#fff;border:2.5px solid var(--gold);box-shadow:0 0 0 4px var(--cream)}
.p-card{border-radius:16px;padding:20px 22px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.p-hora{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;
  color:var(--gold-deep);margin-bottom:7px}
.p-tit{font-family:var(--display);font-size:26px;font-weight:700;color:var(--navy);line-height:1.14;margin-bottom:4px}
.p-sub{font-size:12px;color:var(--ink-soft);margin-bottom:11px;display:flex;align-items:center;gap:6px}
.p-txt{font-size:15px;margin-bottom:12px}
.imperdivel{border-radius:12px;padding:14px 16px;margin-bottom:12px;
  background:linear-gradient(140deg,rgba(215,169,75,.13),rgba(233,196,106,.06));border:1px solid rgba(215,169,75,.28)}
.imperdivel .rot{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--gold-deep);
  margin-bottom:8px;display:flex;align-items:center;gap:6px}
.imperdivel ul{list-style:none}
.imperdivel li{display:flex;gap:8px;font-size:14px;padding:3px 0;line-height:1.5}
.imperdivel li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:8px}
.dica{border-radius:12px;padding:13px 15px;font-size:14px;color:var(--ink-soft);
  background:rgba(30,42,71,.045);border-left:3px solid var(--navy);display:flex;gap:10px}
.dica b{color:var(--navy)}
.p-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.p-ing{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--navy);
  padding:10px 16px;border-radius:999px}
.p-ing:hover{background:var(--navy-deep)}
.p-ing.fantasma{background:transparent;color:var(--navy);border:1px solid var(--line)}
.p-ing.fantasma:hover{background:rgba(30,42,71,.06)}
.btn-mapa+.btn-mapa{margin-top:9px}

/* trajeto */
.traj{display:flex;align-items:center;gap:11px;margin:0 0 14px;padding:11px 14px;border-radius:12px;
  background:rgba(255,255,255,.5);border:1px dashed rgba(30,42,71,.18);font-size:13.5px;color:var(--ink-soft)}
.traj .selo{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;
  border-radius:8px;font-size:12.5px;font-weight:800;color:#fff;background:var(--navy);flex:none}
.traj .selo.rer{border-radius:50%}
.traj .selo.pe{background:var(--gold-deep)}
.traj b{color:var(--ink)}

/* refeição */
.ref{border-radius:16px;padding:18px 20px;background:linear-gradient(140deg,#fff,rgba(245,238,224,.7));
  border:1px solid var(--line);box-shadow:var(--sh)}
.ref .rot{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--gold-deep);
  margin-bottom:11px;display:flex;align-items:center;gap:7px}
.ref-op{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ref-op:first-of-type{border-top:none;padding-top:2px}
.ref-op strong{font-size:15.5px;font-weight:800;display:block;color:var(--navy)}
.ref-op span{font-size:13px;color:var(--ink-soft)}
.ref-preco{font-size:12.5px;font-weight:800;color:var(--gold-deep);white-space:nowrap;text-align:right}

/* extras do dia */
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px}
.extra{border-radius:16px;padding:18px 20px}
.extra .rot{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:800;margin-bottom:8px;color:var(--navy)}
.extra p{font-size:14px;color:var(--ink-soft)}
.extra.chuva .rot{color:#3A5A8C}
.extra.noite .rot{color:var(--gold-deep)}
.btn-mapa{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;text-decoration:none;
  padding:15px;border-radius:14px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;
  background:linear-gradient(96deg,var(--navy),var(--navy-2));box-shadow:0 8px 22px rgba(30,42,71,.2)}
.btn-mapa:hover{filter:brightness(1.1)}

/* tabelas */
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab th{text-align:left;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-deep);
  font-weight:800;padding:0 8px 11px 0;border-bottom:1px solid var(--line)}
.tab td{padding:13px 8px 13px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tab tr:last-child td{border-bottom:none}
.tab a{color:var(--navy);font-weight:700}
.orc-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:16px;padding-top:16px;
  border-top:2px solid var(--navy)}
.orc-total span{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
.orc-total b{font-family:var(--display);font-size:34px;font-weight:700}

/* frases */
.frase{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.frase:last-child{border-bottom:none}
.frase .fr{font-family:var(--display);font-size:21px;font-weight:600;color:var(--navy)}
.frase .pt{font-size:13.5px;color:var(--ink-soft);text-align:right;flex:1}

/* alerta */
.alerta{border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;gap:12px;font-size:14.5px;
  background:linear-gradient(140deg,rgba(124,59,59,.09),rgba(124,59,59,.03));border:1px solid rgba(124,59,59,.2)}
.alerta .ico{color:var(--wine);flex:none}
.alerta b{color:var(--wine)}

/* checklist */
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 22px}
.check label{display:flex;gap:10px;padding:8px 0;font-size:14.5px;cursor:pointer;align-items:flex-start}
.check input{appearance:none;flex:none;width:19px;height:19px;margin-top:3px;border-radius:6px;
  border:1.5px solid var(--gold);background:#fff;position:relative;cursor:pointer;transition:.15s}
.check input:checked{background:linear-gradient(140deg,var(--gold),var(--gold-2));border-color:var(--gold)}
.check input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.check input:checked + span{opacity:.42;text-decoration:line-through}
.check input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* fim */
.fim{margin-top:56px;padding:56px 20px 48px;text-align:center;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 130% at 50% 0%,var(--navy-2),var(--navy) 48%,var(--navy-deep))}
.fim-logo{width:72px;height:72px;display:block;margin:0 auto 20px;border-radius:50%}
.fim h2{font-family:var(--display);font-size:clamp(30px,7vw,42px);font-weight:700;margin-bottom:12px}
.fim p{font-size:15px;color:rgba(255,255,255,.76);max-width:440px;margin:0 auto 8px}
.fim .ass{font-family:var(--display);font-style:italic;font-size:20px;margin-top:20px}

/* barra fixa */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:10px 16px;display:flex;gap:10px;
  align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(30,42,71,.08)}
.barra .apoio{font-size:12.5px;color:var(--ink-soft);font-weight:600;line-height:1.3}
.barra .bts{display:flex;gap:8px;flex:none}
.barra a,.barra button{display:inline-flex;align-items:center;gap:7px;text-decoration:none;cursor:pointer;
  font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.05em;padding:11px 16px;border-radius:999px;border:none}
.bt-zap{background:linear-gradient(96deg,var(--gold-deep),var(--gold));color:#fff}
.bt-pdf{background:rgba(30,42,71,.08);color:var(--navy)}

/* demo */
.demo{background:var(--wine);color:#fff;text-align:center;padding:9px 14px;font-size:12px;letter-spacing:.03em}

@media (max-width:560px){
  .capa-datas{gap:14px;padding:12px 18px}
  .voo-lado{min-width:64px}
  .voo-hora{font-size:26px}
  .barra .apoio{display:none}
  .barra{justify-content:stretch}
  .barra .bts{flex:1}
  .barra .bts a,.barra .bts button{flex:1;justify-content:center}
  .ref-op{flex-direction:column;gap:3px}
  .ref-preco{text-align:left}
  .tab thead{display:none}
  .tab,.tab tbody,.tab tr,.tab td{display:block;width:100%}
  .tab tr{padding:14px 0;border-bottom:1px solid var(--line)}
  .tab tr:last-child{border-bottom:none}
  .tab td{padding:2px 0;border:none;font-size:14px}
  .tab td:first-child{font-size:16px;margin-bottom:5px}
  .tab td:not(:first-child)::before{content:attr(data-r);display:inline-block;min-width:118px;
    font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--gold-deep)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rolar svg{animation:none}}
@media print{
  .nav,.barra,.rolar{display:none!important}
  body{background:#fff;padding-bottom:0}
  .painel[hidden]{display:block!important}
  .abas{display:none}
  .capa{page-break-after:always;padding:64px 20px 70px}
  .capa::after{display:none}
  .sec{padding-top:26px}
  .dia-cab{page-break-before:always;page-break-after:avoid}
  .card,.opt,.p-card,.ref,.dia-cab,.voo-card,.extra{page-break-inside:avoid;box-shadow:none}
  .imperdivel,.dica,.alerta,.frase,.linha{page-break-inside:avoid}
  .sec-cab{page-break-after:avoid}
  .btn-mapa{box-shadow:none}
  a{text-decoration:none}
}

const ic = (n,s=18) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICO[n]||ICO.info}</svg>`;

const H = [];

/* ---------- contagem regressiva ---------- */
function cron(iso){
  if(!iso) return "";
  const alvo=new Date(iso+"T00:00:00"), hoje=new Date(); hoje.setHours(0,0,0,0);
  const d=Math.round((alvo-hoje)/86400000);
  let txt;
  if(d>1) txt=`faltam <b class="grad-luz">${d}</b> dias`;
  else if(d===1) txt=`é <b class="grad-luz">amanhã</b>`;
  else if(d===0) txt=`<b class="grad-luz">é hoje</b>`;
  else return "";
  return `<div class="cron vidro-esc">${ic('relogio',17)}<span>${txt}</span></div>`;
}

const C=R.capa;
const datasBox = tem(C.chegada)
  ? `<div class="capa-datas vidro-esc">
      <div><span>chegada</span><b>${C.chegada}</b></div>
      <div class="sep">${ic('setaDir',20)}</div>
      <div><span>volta</span><b>${C.saida}</b></div>
    </div>
    <div>${cron(C.dataChegadaISO)}</div>`
  : `<div class="capa-datas vidro-esc capa-datas-tbd">
      <div><span>datas</span><b>${C.periodoAproximado||'A confirmar'}</b></div>
    </div>`;

H.push(`<header class="capa">
  <div class="capa-brilho"></div>
  <div class="capa-in">
    <img class="capa-logo" src="${LOGO}" alt="Paris Sem Segredos">
    ${tem(C.saudacao)?`<p class="saud">${C.saudacao}</p>`:''}

    ${tem(C.subtitulo)?`<p class="capa-sub">${C.subtitulo}</p>`:''}
    ${datasBox}
    ${tem(C.chips)?`<div class="capa-chips">${C.chips.map(c=>`<span class="capa-chip">${ic(c.i,14)}${c.t}</span>`).join('')}</div>`:''}
    <a href="#roteiro" class="capa-cta-roteiro">${ic('mapa',18)}Ver roteiro dia a dia</a>
    <div class="rolar">role para ver${ic('seta',16)}</div>
  </div>
</header>`);

/* ---------- navegação ---------- */
const navItens=[];
if(tem(R.carta)) navItens.push(['#topo','Início','']);
if(R.voos || R.comoEscolherVoo) navItens.push(['#voos','Voos','']);
if(tem(R.aeroportos)) navItens.push(['#aeroporto','Aeroporto','']);
if(R.hospedagem || R.ondeSeHospedar) navItens.push(['#base','Onde ficam','']);
if(R.transporte) navItens.push(['#transporte','Transporte','']);
if(R.preparacao) navItens.push(['#preparacao','Checklist','']);
(R.dias||[]).length ? navItens.push(['#roteiro','Roteiro','']) : null;
if(R.reservas) navItens.push(['#reservas','Reservas','']);
if(R.orcamento) navItens.push(['#orcamento','Orçamento','']);
if(R.etiqueta) navItens.push(['#mesa','Na mesa','']);
if(R.cuidados) navItens.push(['#cuidados','Cuidados','']);
if(R.depois) navItens.push(['#depois','Depois','']);
H.push(`<nav class="nav"><div class="nav-sc">${
  navItens.map(([h,t,d])=>`<a href="${h}"${d!==''?` data-dia="${d}"`:''}>${t}</a>`).join('')
}</div></nav>`);

/* ---------- carta ---------- */
if(tem(R.carta)){
  H.push(`<section class="sec wrap carta" id="topo">
    <div class="carta-box vidro">
      ${R.carta.map(p=>`<p>${p}</p>`).join('')}
      ${tem(R.assinaturaCarta)?`<p class="assina grad">${R.assinaturaCarta}</p>`:''}
    </div>
  </section>`);
}

const cab=(eb,ebIco,tit,sub)=>`<div class="sec-cab">
  <div class="eyebrow">${ic(ebIco,13)}${eb}</div>
  <h2>${tit}</h2>${sub?`<p>${sub}</p>`:''}</div>`;

/* ---------- CTA de atualização (quando voo/hospedagem ainda não foram fechados) ---------- */
function ctaAtualizar(msg){
  if(!R.contato || !R.contato.whatsapp) return '';
  const url = `https://wa.me/${R.contato.whatsapp}?text=${encodeURIComponent(msg)}`;
  return `<a class="p-ing" href="${url}" target="_blank" rel="noopener" style="margin-top:16px">${ic('telefone',14)}Já resolvi isso, quero atualizar meu roteiro</a>`;
}

/* ---------- voos ---------- */
if(R.voos){
  const lv=v=>`<div class="voo">
    <div class="voo-lado"><div class="voo-hora">${v.saidaHora}</div><div class="voo-cod">${v.saidaCod}</div><div class="voo-cid">${v.saidaCidade}</div></div>
    <div class="voo-meio"><span class="voo-dur">${ic('aviao',13)}${v.duracao}</span></div>
    <div class="voo-lado"><div class="voo-hora">${v.chegadaHora}</div><div class="voo-cod">${v.chegadaCod}</div><div class="voo-cid">${v.chegadaCidade}</div></div>
  </div>`;
  const bloco=v=>`<div class="voo-card">
    <div class="voo-top"><div class="voo-cia">${ic('aviao',17)}${v.cia}</div><span class="eti">${v.tag}</span></div>
    ${lv(v)}</div>`;
  H.push(`<section class="sec wrap" id="voos">
    ${cab('Deslocamento','aviao','Os voos de vocês')}
    ${bloco(R.voos.ida)}${bloco(R.voos.volta)}
    ${tem(R.voos.observacao)?`<div class="dica">${ic('info',18)}<span>${R.voos.observacao}</span></div>`:''}
  </section>`);
} else if (R.comoEscolherVoo) {
  const v = R.comoEscolherVoo;
  H.push(`<section class="sec wrap" id="voos">
    ${cab('Deslocamento','aviao','Como escolher o voo', v.texto||'')}
    <div class="card">
      <div class="linhas">${(v.pontos||[]).map(([k,val])=>`
        <div class="linha"><span class="ico">${ic('check',16)}</span><span class="txt"><span class="rot">${k}</span><span class="val">${val}</span></span></div>`).join('')}</div>

/* ---------- dias ---------- */
if(tem(R.dias)){
  /* ---- links do Google Maps gerados a partir dos endereços ---- */
  const gBusca = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  function rotasDoDia(d){
    const pts = d.paradas.filter(p=>tem(p.mapa)).map(p=>({nome:p.titulo, q:p.mapa}));
    if(pts.length < 2) return [];
    const MAX = 5; /* origem + 3 pontos intermediários + destino, limite do navegador do celular */
    const blocos = [];
    for(let i=0; i<pts.length-1; i+=MAX-1) blocos.push(pts.slice(i, i+MAX));
    return blocos.map((b,i)=>{
      const o = encodeURIComponent(b[0].q);
      const dst = encodeURIComponent(b[b.length-1].q);
      const w = b.slice(1,-1).map(x=>encodeURIComponent(x.q)).join('%7C');
      return {
        url:`https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${dst}${w?`&waypoints=${w}`:''}&travelmode=walking`,
        rot: blocos.length===1 ? 'Abrir a rota deste dia a pé'
             : `Rota ${i+1} de ${blocos.length}: ${b[0].nome} até ${b[b.length-1].nome}`
      };
    });
  }
  const modoIco={metro:'metro',rer:'trem',pe:'pe',onibus:'onibus',taxi:'taxi',tram:'tram',trem:'trem'};
  const traj=t=>{
    if(!t) return '';
    const selo = t.linha
      ? `<span class="selo${t.modo==='rer'?' rer':''}">${t.linha}</span>`
      : `<span class="selo pe">${ic(modoIco[t.modo]||'pe',15)}</span>`;
    return `<div class="traj">${selo}<span>${t.texto}</span></div>`;
  };
  const parada=p=>{
    if(p.tipo==='refeicao'){
      return `<div class="parada"><div class="ref">
        <div class="rot">${ic('garfo',14)}${p.hora} · ${p.titulo}</div>
        ${tem(p.nota)?`<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:10px">${p.nota}</p>`:''}
        ${p.opcoes.map(o=>`<div class="ref-op"><div><strong>${o.nome}</strong><span>${o.detalhe||''}</span></div><div class="ref-preco">${o.preco||''}</div></div>`).join('')}
      </div></div>${traj(p.trajeto)}`;
    }
    return `<div class="parada"><div class="p-card">
      <div class="p-hora">${ic('relogio',13)}${p.hora}</div>
      <h4 class="p-tit">${p.titulo}</h4>
      ${tem(p.sub)?`<div class="p-sub">${ic('pin',13)}${p.sub}</div>`:''}
      ${tem(p.texto)?`<p class="p-txt">${p.texto}</p>`:''}
      ${tem(p.imperdivel)?`<div class="imperdivel"><div class="rot">${ic('estrela',13)}${p.imperdivelTitulo||'Não saiam de lá sem ver'}</div>
        <ul>${p.imperdivel.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
      ${tem(p.dica)?`<div class="dica">${ic('raio',18)}<span>${p.dica}</span></div>`:''}
      ${(p.ingresso||tem(p.mapa))?`<div class="p-acoes">
        ${p.ingresso?`<a class="p-ing" href="${p.ingresso.url}" target="_blank" rel="noopener">${ic('ingresso',14)}${p.ingresso.texto}</a>`:''}
        ${tem(p.mapa)?`<a class="p-ing fantasma" href="${gBusca(p.mapa)}" target="_blank" rel="noopener">${ic('pin',14)}Ver no mapa</a>`:''}
      </div>`:''}
    </div></div>${traj(p.trajeto)}`;
  };
  const abas=R.dias.map((d,i)=>
    `<button class="aba" role="tab" data-g="dia" data-i="${i}" aria-selected="${i===0}">Dia ${i+1}<small>${(d.data||'').split(',')[1]||''}</small></button>`).join('');
  const paineis=R.dias.map((d,i)=>`
    <div class="painel" data-g="dia" data-i="${i}"${i===0?'':' hidden'}>
      <div class="dia-cab">
        <div class="dia-num">Dia ${i+1} de ${R.dias.length}</div>
        <h3>${d.titulo}</h3>
        <div class="dia-meta">
          ${d.data?`<span>${ic('calendario',13)}${d.data}</span>`:''}
          ${d.bairro?`<span>${ic('pin',13)}${d.bairro}</span>`:''}
          ${d.saida?`<span>${ic('relogio',13)}${d.saida}</span>`:''}
        </div>
      </div>
      <div class="trilho">${d.paradas.map(parada).join('')}</div>
      <div class="extras">
        ${tem(d.seChover)?`<div class="extra chuva vidro"><div class="rot">${ic('chuva',15)}Se chover</div><p>${d.seChover}</p></div>`:''}
        ${tem(d.seSobrarEnergia)?`<div class="extra noite vidro"><div class="rot">${ic('lua',15)}Se sobrar energia</div><p>${d.seSobrarEnergia}</p></div>`:''}
      </div>
      ${rotasDoDia(d).map(r=>`<a class="btn-mapa" href="${r.url}" target="_blank" rel="noopener">${ic('mapa',16)}${r.rot}</a>`).join('')}
    </div>`).join('');
  H.push(`<section class="sec wrap" id="roteiro">
    ${cab('O roteiro','mapa','Dia a dia','Os horários são um guia, não uma obrigação: sigam no ritmo de vocês. Os botões de rota abrem o Google Maps já com o caminho traçado.')}
    <div class="abas" role="tablist">${abas}</div>${paineis}
  </section>`);
}

    </span>`;

/* ---------- abas ---------- */
function trocar(g,i){
  document.querySelectorAll(`.aba[data-g="${g}"]`).forEach(b=>b.setAttribute('aria-selected', b.dataset.i===String(i)));
  document.querySelectorAll(`.painel[data-g="${g}"]`).forEach(p=>{ p.hidden = p.dataset.i!==String(i); });
}
document.addEventListener('click', e=>{
  const aba=e.target.closest('.aba');
  if(aba){ trocar(aba.dataset.g, aba.dataset.i); return; }
  const link=e.target.closest('.nav a[data-dia]');
  if(link){ trocar('dia', link.dataset.dia); }
});

/* ---------- checklist com memoria no navegador ---------- */
(function(){
  const chave = i => 'roteiro_ck::' + location.pathname + '::' + i;
  document.querySelectorAll('.ck-persist').forEach(cb=>{
    const k = chave(cb.dataset.ckid);
    try{ cb.checked = localStorage.getItem(k) === '1'; }catch(e){}
    cb.addEventListener('change', ()=>{
      try{ localStorage.setItem(k, cb.checked ? '1':'0'); }catch(e){}
    });
  });
})();
</script>
